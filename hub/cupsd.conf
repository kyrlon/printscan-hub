# PrintScan Hub CUPS configuration.
# This is only the *default*: on first start it is copied to ./data/cups/cupsd.conf,
# and that copy is what CUPS uses from then on (edit it there, then restart).

LogLevel warn
MaxLogSize 1m
PageLogFormat
ErrorPolicy retry-job
PreserveJobHistory 1d
PreserveJobFiles No

# Listen on all interfaces and accept any Host: header (IP, hostname, .local).
# The port is set from CUPS_PORT in .env on every start (default 631).
Port 631
Listen /run/cups/cups.sock
ServerAlias *
HostNameLookups Off

# Share every printer on the LAN and advertise it via Bonjour/mDNS so that
# Windows, macOS, iOS, Android and ChromeOS can find it without vendor drivers
# (IPP Everywhere / AirPrint / Mopria).
Browsing On
BrowseLocalProtocols dnssd
DefaultShared Yes
WebInterface Yes

DefaultAuthType Basic
DefaultEncryption IfRequested

# Anyone on the local network may print and view queues.
<Location />
  Order allow,deny
  Allow @LOCAL
</Location>

# Administration requires a member of the lpadmin group (ADMIN_USER in .env).
<Location /admin>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow @LOCAL
</Location>
<Location /admin/conf>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow @LOCAL
</Location>
<Location /admin/log>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow @LOCAL
</Location>

<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default
  <Limit Create-Job Print-Job Print-URI Validate-Job>
    Order deny,allow
  </Limit>
  <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job Cancel-My-Jobs Close-Job CUPS-Move-Job>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>
  <Limit CUPS-Get-Document>
    AuthType Default
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>
  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>
  <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After Cancel-Jobs CUPS-Accept-Jobs CUPS-Reject-Jobs>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>
  <Limit Cancel-Job CUPS-Authenticate-Job>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>
  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
