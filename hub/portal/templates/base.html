<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ hub_name }}{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icon.svg') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <meta name="theme-color" content="#2563eb">
  <style>
    :root { --bg:#f5f6f8; --card:#fff; --text:#1d2330; --muted:#667085; --line:#e3e6eb;
            --accent:#2563eb; --ok:#147a3d; --okbg:#e7f6ec; --err:#b42318; --errbg:#fdecea;
            --warn:#8a4b00; --warnbg:#fff6e0; --warnline:#f3d48b; --ink-black:#1d2330; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#12151b; --card:#1b2029; --text:#e6e9ef; --muted:#98a2b3; --line:#2b3240;
              --accent:#6b9cff; --ok:#6fd49a; --okbg:#173325; --err:#ff8a80; --errbg:#3a1d1b;
              --warn:#ffcc66; --warnbg:#33280f; --warnline:#5c4818; --ink-black:#c9ced8; }
    }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
    header { background:var(--card); border-bottom:1px solid var(--line); }
    header .wrap { display:flex; align-items:center; gap:20px; flex-wrap:wrap; padding-top:12px; padding-bottom:12px; }
    header .brand { font-size:17px; font-weight:700; margin-right:auto; color:var(--text);
                    display:inline-flex; align-items:center; gap:9px; }
    header .brand img { border-radius:6px; }
    header .brand:hover { color:var(--text); }
    main.wrap.full { max-width:none; padding:0; }
    .scan-bar { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
                padding:6px 16px; border-bottom:1px solid var(--line); background:var(--card); }
    .files-mode, .account { display:inline-flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .seg { display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
    .seg button { background:transparent; color:var(--muted); border:0; border-radius:0; padding:4px 12px;
                  font-size:13px; font-weight:600; }
    .seg button + button { border-left:1px solid var(--line); }
    .seg button.on { background:var(--accent); color:#fff; }
    .scan-note { padding:4px 16px; background:var(--card); border-bottom:1px solid var(--line); }
    .scan-frame { display:block; width:100%; height:calc(100vh - 92px); border:0; background:#fff; }
    header a { color:var(--muted); text-decoration:none; }
    header a:hover, header a.on { color:var(--accent); }
    .wrap { max-width:960px; margin:0 auto; padding:0 16px; }
    main.wrap { padding-top:24px; padding-bottom:48px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:20px; }
    h1 { font-size:22px; margin:0 0 4px; } h2 { font-size:17px; margin:0 0 12px; }
    .muted { color:var(--muted); } .small { font-size:13px; }
    label { display:block; font-weight:600; margin:12px 0 4px; font-size:14px; }
    input[type=text], input[type=number], input[type=password], select, textarea {
      width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px;
      background:var(--bg); color:var(--text); font:inherit; }
    input[type=file] { width:100%; padding:16px; border:2px dashed var(--line); border-radius:8px; background:var(--bg); color:var(--text); }
    .row { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:0 16px; }
    .checks { display:flex; gap:20px; flex-wrap:wrap; margin-top:12px; }
    .checks label { font-weight:400; display:flex; gap:6px; align-items:center; margin:0; }
    button, .btn { display:inline-block; padding:8px 16px; border-radius:6px; border:1px solid var(--accent);
      background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; text-decoration:none; }
    button.secondary, .btn.secondary { background:transparent; color:var(--accent); }
    button.danger { background:transparent; color:var(--err); border-color:var(--err); }
    button.sm { padding:3px 10px; font-size:13px; font-weight:500; }
    .primary-action { margin-top:18px; width:100%; padding:12px; font-size:16px; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--muted); font-weight:600; font-size:13px; }
    .table-scroll { overflow-x:auto; }
    .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; background:var(--bg); border:1px solid var(--line); }
    .pill.idle, .pill.completed { color:var(--ok); } .pill.stopped, .pill.aborted { color:var(--err); }
    .flash { padding:10px 14px; border-radius:8px; margin-bottom:16px; }
    .flash.ok { background:var(--okbg); color:var(--ok); } .flash.error { background:var(--errbg); color:var(--err); }
    .flash.warn { background:var(--warnbg); color:var(--warn); border:1px solid var(--warnline); }
    .flash.warn a { color:inherit; }
    .supplies { display:grid; gap:5px; min-width:190px; }
    .supply { display:grid; grid-template-columns:64px 1fr 44px; align-items:center; gap:8px; font-size:13px; }
    .supply .track { height:10px; border-radius:5px; background:var(--bg); border:1px solid var(--line); overflow:hidden; }
    .supply .fill { height:100%; border-radius:5px 0 0 5px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12); }
    .supply .fill.black { background:var(--ink-black) !important; }
    .supply .pct { text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; }
    .supply.low .pct { color:var(--warn); font-weight:600; }
    .alert { display:inline-block; margin:4px 4px 0 0; padding:1px 8px; border-radius:999px; font-size:12px; font-weight:600; }
    .alert.error { background:var(--errbg); color:var(--err); }
    .alert.warn { background:var(--warnbg); color:var(--warn); }
    .alert.info { background:var(--bg); color:var(--muted); border:1px solid var(--line); }
    .linkish { font-size:13px; color:var(--accent); text-decoration:none; white-space:nowrap; }
    .linkish:hover { text-decoration:underline; }
    .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:20px; margin:8px 0 24px; }
    .tile { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center;
            min-height:260px; padding:32px 24px; border-radius:16px; background:var(--card); border:2px solid var(--line);
            color:var(--text); text-decoration:none; transition:border-color .15s, transform .15s, box-shadow .15s; }
    .tile:hover, .tile:focus-visible { border-color:var(--accent); transform:translateY(-2px);
            box-shadow:0 8px 24px rgba(0,0,0,.12); outline:none; }
    .tile-icon { display:grid; place-items:center; width:96px; height:96px; border-radius:50%;
            background:color-mix(in srgb, var(--accent) 14%, transparent); color:var(--accent); }
    .tile-icon svg { width:54px; height:54px; }
    .tile-title { font-size:30px; font-weight:700; letter-spacing:-.01em; }
    .tile-sub { color:var(--muted); font-size:15px; max-width:30ch; }
    @media (max-width:600px) { .tile { min-height:180px; padding:24px 16px; } .tile-icon { width:72px; height:72px; } .tile-icon svg { width:40px; height:40px; } }
    .size-hint { margin-top:4px; min-height:1.2em; }
    .size-hint.too-big { color:var(--err); font-weight:600; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    button.busy { opacity:.8; cursor:progress; }
    .spin { display:inline-block; width:.9em; height:.9em; margin-right:6px; vertical-align:-.1em;
            border:2px solid currentColor; border-right-color:transparent; border-radius:50%;
            animation:spin .7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spin { animation-duration:2s; } }
    .warn-list { margin:8px 0 4px; padding-left:20px; }
    .warn-list li { margin:3px 0; }
    code, pre { font-family:ui-monospace,Consolas,monospace; font-size:13px; }
    code { background:var(--bg); padding:1px 5px; border-radius:4px; word-break:break-all; }
    pre { background:var(--bg); padding:12px; border-radius:8px; overflow:auto; max-height:420px; white-space:pre-wrap; }
    .inline { display:inline; } .actions { display:flex; gap:6px; flex-wrap:wrap; }
    details summary { cursor:pointer; font-weight:600; }
    details > div { padding-top:8px; }
  </style>
</head>
<body>
<header><div class="wrap">
  <a href="{{ url_for('index') }}" class="brand"><img src="{{ url_for('static', filename='icon.svg') }}" alt="" width="24" height="24">{{ hub_name }}</a>
  <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}on{% endif %}">Home</a>
  <a href="{{ url_for('print_page') }}" class="{% if request.endpoint == 'print_page' %}on{% endif %}">Print</a>
  <a href="{{ url_for('scan') }}" class="{% if request.endpoint == 'scan' %}on{% endif %}">Scan</a>
  <a href="{{ url_for('admin') }}" class="{% if request.path.startswith('/admin') %}on{% endif %}">Admin</a>
</div></header>
<main class="wrap {% block main_class %}{% endblock %}">
  {% for cat, msg in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ cat }}">{{ msg }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
<script>
// Check upload size as soon as a file is picked (the server enforces it too).
document.querySelectorAll('input[type=file][data-max-mb]').forEach(function (input) {
  var hint = input.nextElementSibling;
  var button = input.form && input.form.querySelector('button[type=submit], button:not([type])');
  function fmt(b) { return b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; }
  input.addEventListener('change', function () {
    var limit = parseFloat(input.dataset.maxMb) * 1048576, total = 0;
    for (var i = 0; i < input.files.length; i++) total += input.files[i].size;
    var tooBig = total > limit;
    input.setCustomValidity(tooBig ? 'Too large' : '');
    if (button) button.disabled = tooBig;
    if (hint) {
      hint.className = 'size-hint small ' + (tooBig ? 'too-big' : 'muted');
      hint.textContent = !input.files.length ? '' : tooBig
        ? fmt(total) + ' is over the ' + input.dataset.maxMb + ' MB limit. Pick a smaller file, or ask the admin to raise the limit.'
        : fmt(total) + ' of ' + input.dataset.maxMb + ' MB allowed';
    }
  });
});

// After an action that returns to a section (#printers, #scanners, ...), show its
// message there instead of at the top of the page, where it would be off-screen.
(function () {
  var target = location.hash && document.getElementById(location.hash.slice(1));
  var flashes = document.querySelectorAll('main > .flash');
  if (!target || !flashes.length) return;
  var anchor = target.matches('.card') ? target.querySelector('h1, h2') : null;
  flashes.forEach(function (f) {
    if (anchor) anchor.insertAdjacentElement('afterend', f);
    else target.insertAdjacentElement('beforebegin', f);
  });
  target.scrollIntoView();
})();

// Forms marked data-busy="Searching…" show a spinner and a seconds counter on
// their button while the page waits, so slow requests don't look stuck.
document.querySelectorAll('form[data-busy]').forEach(function (form) {
  form.addEventListener('submit', function (e) {
    if (e.defaultPrevented) return;            // e.g. a cancelled confirm()
    var btn = e.submitter || form.querySelector('button[type=submit], button:not([type])');
    if (!btn) return;
    var label = form.dataset.busy, t0 = Date.now();
    // Disable after the submit has been dispatched so the button's value is still sent.
    setTimeout(function () {
      btn.disabled = true;
      btn.classList.add('busy');
      btn.setAttribute('aria-busy', 'true');
      var tick = function () {
        var s = Math.floor((Date.now() - t0) / 1000);
        btn.innerHTML = '<span class="spin" aria-hidden="true"></span>' + label + (s ? ' ' + s + 's' : '');
      };
      tick();
      setInterval(tick, 1000);
    }, 0);
  });
});
// Coming back with the browser's Back button restores the page from cache: reset.
window.addEventListener('pageshow', function (e) {
  if (e.persisted && document.querySelector('button.busy')) location.reload();
});
</script>
</body>
</html>
